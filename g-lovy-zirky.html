<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лови зірки</title>
<style>
:root{--bg:#f4f1ea;--fg:#1d1d1f;--card:#fff;--star:#f2a900;--bomb:#d6453d;--basket:#2b6cb0;--muted:#6b6b70;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--fg:#f1f1f3;--card:#1f2228;--star:#ffd24a;--bomb:#ff6b62;--basket:#5aa2ff;--muted:#9a9aa2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--fg:#f1f1f3;--card:#1f2228;--star:#ffd24a;--bomb:#ff6b62;--basket:#5aa2ff;--muted:#9a9aa2;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
header{display:flex;justify-content:space-between;padding:12px 16px 4px;font-size:18px;font-weight:600}
#fx{display:flex;gap:6px;padding:0 16px;height:28px;font-size:14px;font-weight:700}
#fx span{background:var(--card);border-radius:10px;padding:3px 8px}
#wrap{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border-radius:20px;padding:26px 22px;text-align:center;max-width:340px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
h1{margin:0 0 8px;font-size:28px}
p{margin:6px 0;color:var(--muted);line-height:1.4;font-size:14px}
button{margin-top:16px;font:inherit;font-weight:600;font-size:18px;padding:12px 32px;border:0;border-radius:14px;background:var(--basket);color:#fff;cursor:pointer}
</style>
</head>
<body>
<header><span id="score">⭐ 0</span><span id="best">Рекорд: 0</span><span id="lives">❤️❤️❤️</span></header>
<div id="fx"></div>
<div id="wrap"><canvas id="c"></canvas>
<div id="overlay"><div class="card"><h1 id="title">Лови зірки</h1><p id="msg">Води пальцем і ловити по одній зірці ⭐. Обходь бомби 💣. З неба падають бонуси: ❤️ життя, 🛡️ щит, 🧲 магніт, 🐢 уповільнення, ↔️ широкий кошик, ✨ подвійні очки.</p><button id="go">Грати</button></div></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W,H,dpr,css;
function resize(){dpr=window.devicePixelRatio||1;const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);css=getComputedStyle(document.documentElement)}
window.addEventListener('resize',resize);resize();
let best=0;try{best=+localStorage.getItem('zirky-best')||0}catch(e){}
$('best').textContent='Рекорд: '+best;
// audio
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,vol,slide,delay){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+(delay||0);o.type=type;o.frequency.setValueAtTime(f,s);if(slide)o.frequency.exponentialRampToValueAtTime(slide,s+d);g.gain.setValueAtTime(vol,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d)}
function noise(d,vol){const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=vol;s.connect(g);g.connect(a.destination);s.start()}
function sfx(k){if(k==='star'){const m=1+Math.min(streak,10)*.06;tone(880*m,.1,'triangle',.25,1320*m);tone(1320*m,.12,'triangle',.2,1760*m,.06)}
else if(k==='bomb'){noise(.4,.5);tone(140,.4,'sawtooth',.3,40)}
else if(k==='miss'){tone(300,.25,'square',.12,150)}
else if(k==='pow'){[523,659,784,1047].forEach((f,i)=>tone(f,.12,'triangle',.22,0,i*.06))}
else if(k==='shield'){tone(200,.25,'sine',.3,900)}
else if(k==='over'){[392,330,262,196].forEach((f,i)=>tone(f,.3,'triangle',.25,0,i*.18))}
else if(k==='start'){[523,659,784].forEach((f,i)=>tone(f,.12,'triangle',.2,0,i*.08))}}
// state
const POW=[{k:'life',e:'❤️',n:'+1 життя'},{k:'shield',e:'🛡️',n:'Щит'},{k:'magnet',e:'🧲',n:'Магніт',d:10},{k:'slow',e:'🐢',n:'Повільно',d:9},{k:'wide',e:'↔️',n:'Широкий кошик',d:10},{k:'dbl',e:'✨',n:'Подвійні очки',d:12}];
let px=0,item=null,wait=0,score=0,lives=3,t=0,streak=0,running=false,last=0,shake=0,flash=0,shield=false,parts=[],pops=[],eff={magnet:0,slow:0,wide:0,dbl:0},fxs='';
const BW=80,BH=18;
function pos(e){const r=cv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;px=Math.max(40,Math.min(W-40,p.clientX-r.left))}
['touchstart','touchmove'].forEach(n=>cv.addEventListener(n,e=>{e.preventDefault();pos(e)},{passive:false}));
cv.addEventListener('mousemove',pos);
function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=(.3+Math.random())*sp;parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,l:1,c:col,s:2+Math.random()*3})}}
function pop(x,y,txt,col){pops.push({x:x,y:y,t:txt,c:col,l:1})}
function hud(){$('score').textContent='⭐ '+score;$('lives').textContent='❤️'.repeat(Math.max(lives,0))||'💔'}
function fxHud(){let s='';if(shield)s+='<span>🛡️</span>';for(const p of POW)if(p.d&&eff[p.k]>0)s+='<span>'+p.e+' '+Math.ceil(eff[p.k])+'</span>';if(s!==fxs){fxs=s;$('fx').innerHTML=s}}
function start(){sfx('start');score=0;lives=3;item=null;wait=.5;t=0;streak=0;shield=false;parts=[];pops=[];shake=0;flash=0;eff={magnet:0,slow:0,wide:0,dbl:0};running=true;$('overlay').style.display='none';px=W/2;hud();fxHud();last=performance.now();requestAnimationFrame(loop)}
function end(){running=false;if(score>best){best=score;try{localStorage.setItem('zirky-best',best)}catch(e){}$('best').textContent='Рекорд: '+best}
$('title').textContent='Гра закінчена';$('msg').textContent='Твій рахунок: '+score+'. Рекорд: '+best;$('go').textContent='Ще раз';$('overlay').style.display='flex'}
$('go').addEventListener('click',start);
function spawn(){const r=Math.random();let type='star',pw=null;
if(r<.13){type='pow';pw=POW[Math.floor(Math.random()*POW.length)];if(pw.k==='life'&&lives>=5)pw=POW[1]}
else if(r<.30)type='bomb';
item={type:type,pw:pw,x:30+Math.random()*(W-60),y:-24,rot:0}}
function activate(p){sfx('pow');pop(px,H-80,p.e+' '+p.n,css.getPropertyValue('--star'));
if(p.k==='life'){lives=Math.min(5,lives+1);hud()}else if(p.k==='shield')shield=true;else eff[p.k]=p.d}
function loop(now){if(!running)return;const dt=Math.min((now-last)/1000,.05);last=now;t+=dt;
for(const k in eff)eff[k]=Math.max(0,eff[k]-dt);
const bw=BW*(eff.wide>0?1.7:1),by=H-BH-24,sp=Math.min(520,170+t*3.5)*(eff.slow>0?.55:1);
if(!item){wait-=dt;if(wait<=0)spawn()}
else{item.y+=sp*dt;item.rot+=dt*2;
if(eff.magnet>0&&item.type!=='bomb')item.x+=(px-item.x)*Math.min(1,dt*3.2);
if(item.y>by-8&&item.y<by+BH&&Math.abs(item.x-px)<bw/2+10){
 if(item.type==='star'){const g=eff.dbl>0?2:1;score+=g;streak++;sfx('star');burst(item.x,item.y,css.getPropertyValue('--star'),14,180);pop(item.x,by-14,'+'+g+(streak>2?' x'+streak:''),css.getPropertyValue('--star'))}
 else if(item.type==='bomb'){streak=0;if(shield){shield=false;sfx('shield');burst(item.x,item.y,css.getPropertyValue('--basket'),20,220);pop(item.x,by-14,'Щит!',css.getPropertyValue('--basket'))}else{lives--;sfx('bomb');burst(item.x,item.y,css.getPropertyValue('--bomb'),28,260);shake=1;flash=1}}
 else{activate(item.pw);burst(item.x,item.y,'#fff',18,220)}
 hud();item=null;wait=.3+Math.random()*.35}
else if(item.y>H+24){if(item.type==='star'){streak=0;if(shield){shield=false;sfx('shield');pop(item.x,H-60,'Щит!',css.getPropertyValue('--basket'))}else{lives--;sfx('miss');burst(item.x,H-6,'#888',8,90);shake=.4}hud()}item=null;wait=.3+Math.random()*.35}}
shake=Math.max(0,shake-dt*2.5);flash=Math.max(0,flash-dt*2.5);
ctx.clearRect(0,0,W,H);ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake*12,(Math.random()-.5)*shake*12);
ctx.textAlign='center';ctx.textBaseline='middle';
if(item){ctx.save();ctx.shadowColor=css.getPropertyValue(item.type==='bomb'?'--bomb':'--star');ctx.shadowBlur=16;ctx.translate(item.x,item.y);ctx.rotate(Math.sin(item.rot)*.3);ctx.font='32px serif';ctx.fillText(item.type==='bomb'?'💣':item.type==='pow'?item.pw.e:'⭐',0,0);ctx.restore()}
ctx.fillStyle=css.getPropertyValue('--basket');ctx.beginPath();ctx.roundRect(px-bw/2,by,bw,BH,9);ctx.fill();
if(shield){ctx.strokeStyle='rgba(120,200,255,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(px-bw/2-6,by-6,bw+12,BH+12,14);ctx.stroke()}
if(eff.magnet>0){ctx.strokeStyle='rgba(255,100,100,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(px,by+BH/2,bw/2+18+Math.sin(t*8)*3,Math.PI,0);ctx.stroke()}
for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.l-=dt*1.6;ctx.globalAlpha=Math.max(p.l,0);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s)}
parts=parts.filter(p=>p.l>0);
ctx.font='bold 20px system-ui,sans-serif';
for(const p of pops){p.y-=50*dt;p.l-=dt*1.1;ctx.globalAlpha=Math.max(p.l,0);ctx.fillStyle=p.c;ctx.fillText(p.t,p.x,p.y)}
pops=pops.filter(p=>p.l>0);ctx.globalAlpha=1;ctx.restore();
if(flash>0){ctx.globalAlpha=flash*.3;ctx.fillStyle=css.getPropertyValue('--bomb');ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
fxHud();
if(lives<=0){hud();sfx('over');end();return}
requestAnimationFrame(loop)}
</script>
<a id="__home" href="index.html" aria-label="До списку ігор" style="position:fixed;left:0;top:32%;z-index:2147483647;width:26px;height:58px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4);color:#fff;border-radius:0 14px 14px 0;font-size:15px;text-decoration:none;opacity:.55;-webkit-tap-highlight-color:transparent">🏠</a>
</body>
</html>
