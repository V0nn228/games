<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шахтар 3D · Карта</title>
<style>
:root{--bg:#12141b;--panel:rgba(16,18,26,.7);--card:#232733;--fg:#fff;--muted:#a9afc0;--gold:#ffd166;--ok:#4cd98a;--acc:#5aa2ff;--line:rgba(255,255,255,.16);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0c12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0c12;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;z-index:3;touch-action:none}
#hud{left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;align-items:center;gap:8px;pointer-events:none}
#hud>*{pointer-events:auto}
.pill{background:var(--panel);border:0;border-radius:12px;padding:7px 12px;font:inherit;font-weight:700;font-size:15px;color:var(--fg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#coins{color:var(--gold);font-size:18px}
#bagw{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:12px;padding:7px 12px;min-width:200px}
#bagbar{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}
#bagf{display:block;height:100%;width:0;background:var(--acc)}
#bagt{font-size:13px;font-weight:700;white-space:nowrap}
.sp{flex:1}
#zname{left:calc(10px + env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 54px);font-size:13px;font-weight:700;background:var(--panel);padding:4px 10px;border-radius:10px;pointer-events:none}
#toast{left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 62px);text-align:center;font-weight:700;text-shadow:0 1px 6px #000;opacity:0;transition:opacity .4s;pointer-events:none}
.pop{position:fixed;transform:translate(-50%,-50%);font-weight:800;font-size:17px;color:#fff;text-shadow:0 0 4px #000,0 2px 4px #000;pointer-events:none;animation:up .85s ease-out forwards;z-index:3}
.pop.crit,.pop.gold{color:var(--gold);font-size:24px}
@keyframes up{to{transform:translate(-50%,-220%);opacity:0}}
#joy{left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:128px;height:128px;border-radius:50%;background:var(--panel);border:2px solid var(--line)}
#knob{position:absolute;left:39px;top:39px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.85);pointer-events:none}
.act{border:2px solid var(--line);border-radius:50%;background:var(--panel);color:var(--fg);display:flex;align-items:center;justify-content:center;padding:0;font-size:28px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#bMine{right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:92px;height:92px;font-size:38px;background:rgba(255,160,60,.75)}
#bSell{right:calc(30px + env(safe-area-inset-right,0px));bottom:calc(130px + env(safe-area-inset-bottom,0px));width:68px;height:68px;background:rgba(60,200,120,.8);display:none}
#bShop{right:calc(124px + env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));width:68px;height:68px;background:rgba(90,162,255,.8);display:none}
.wide{left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));border:0;border-radius:16px;padding:13px 20px;font:inherit;font-weight:800;font-size:16px;color:#fff;display:none;white-space:nowrap;box-shadow:0 5px 0 rgba(0,0,0,.3)}
#bTele{background:#e0409a}#bGate{background:#2f6fe0}
#drawer{right:0;top:0;bottom:0;width:min(46vw,440px);background:var(--bg);border-left:1px solid var(--line);transform:translateX(105%);transition:transform .25s;z-index:6;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(10px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) 10px;box-sizing:border-box;box-shadow:-10px 0 30px rgba(0,0,0,.4);touch-action:pan-y}
#drawer.open{transform:none}
#dtabs{display:flex;gap:6px;margin-bottom:8px}
#dtabs button{flex:1;border:0;border-radius:12px;background:var(--card);color:var(--fg);font:inherit;font-weight:700;font-size:13px;padding:9px 4px}
#dtabs button.on{background:var(--acc);color:#06182f}
#dtabs #dx{flex:0 0 40px}
#dbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pn{display:none}.pn.on{display:block}
.row{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:7px;font:inherit;color:inherit;text-align:left}
.row:disabled{opacity:.5}
.row .ic{font-size:26px;width:34px;text-align:center}
.row .t{flex:1}.row b{display:block;font-size:14px}.row em{font-style:normal;color:var(--muted);font-size:12px;margin-left:6px}
.row small{color:var(--muted);font-size:12px}
.row .c{font-weight:800;color:var(--gold);white-space:nowrap;font-size:13px}
.row.ex{border-color:var(--acc)}
.h{font-size:12px;color:var(--muted);margin:6px 2px}
.info{color:var(--muted);font-size:13.5px;line-height:1.45;margin:0 0 8px}
.pbar{height:10px;border-radius:5px;background:var(--card);overflow:hidden;margin:6px 0 10px}
.pbar i{display:block;height:100%;width:0;background:var(--gold)}
#rb{width:100%;border:0;border-radius:14px;background:#b266ff;color:#fff;font:inherit;font-weight:800;font-size:16px;padding:12px}
#rb:disabled{opacity:.4}
#fade{inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s;z-index:8}
#rot{left:50%;top:calc(env(safe-area-inset-top,0px) + 100px);transform:translateX(-50%);display:none;align-items:center;gap:10px;background:var(--panel);padding:8px 12px;border-radius:12px;font-size:13px;font-weight:700;z-index:7;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#rot button{border:0;border-radius:8px;background:var(--acc);color:#06182f;font:inherit;font-weight:800;padding:5px 10px}
@media (orientation:portrait){#rot{display:flex}#rot.hide{display:none}#drawer{width:88vw}#bagw{min-width:0}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="ui"><div id="coins" class="pill">🪙 0</div><div id="bagw"><div id="bagbar"><i id="bagf"></i></div><span id="bagt"></span></div><div class="sp"></div><button id="snd" class="pill">🔊</button></div>
<div id="zname" class="ui"></div><div id="toast" class="ui"></div>
<div id="joy" class="ui"><div id="knob"></div></div>
<button id="bShop" class="ui act">🛒</button><button id="bSell" class="ui act">💰</button><button id="bMine" class="ui act">⛏</button>
<button id="bTele" class="ui wide">🌀 На поверхню</button><button id="bGate" class="ui wide"></button>
<div id="drawer" class="ui"><div id="dtabs"><button data-t="0">🛒 Магазин</button><button data-t="1">♻️ Ребіс</button><button id="dx">✕</button></div>
<div id="dbody"><div class="pn" id="p0"></div><div class="pn" id="p1"><p class="info" id="rinfo"></p><div class="pbar"><i id="rbar"></i></div><button id="rb">♻️ Переродитися</button></div></div></div>
<div id="rot" class="ui">🔄 Краще грати горизонтально<button id="rotx">Ок</button></div>
<div id="fade" class="ui"></div>
<script src="three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const fmt=n=>{const s=['','K','M','B','T'];let i=0;while(n>=1000&&i<4){n/=1000;i++}return i?n.toFixed(n<10?2:n<100?1:0)+s[i]:String(Math.floor(n))};
// ---- plan constants (local zone coords, room = 30x30 centered at 0) ----
const B=2.4,COLS=8,ROWS=8,DEEP=100,GX=-11.3,GZ=-10.4,PITCH=38,NC=COLS*ROWS;
const SHOP={x:11.3,z:-4.8,w:4.2,d:6},STALL={x:10.9,z:7.5,w:3.6,d:6.5},PINK={x:-1.6,z:12.8},CORX=-1.05;
let S;
const ZN=[
{n:'Поверхня',e:'🌳',cost:0,sky:'#8fd0ff',floor:'#5aa84a',wall:'#2f7d32',acc:'#ffffff',amb:['#ffffff',.8],sun:.8,pt:0,deco:'tree',t:[{n:'Земля',c:'#8a5a35',hp:3,v:1},{n:'Камінь',c:'#8c8f96',hp:7,v:3}],x:{n:'Чоботи швидкості',e:'👢',b:60,g:1.6,d:()=>'Швидкість: +'+S.x[0]*8+'% → +'+(S.x[0]+1)*8+'%'}},
{n:'Печера',e:'🕳️',cost:500,sky:'#15151c',floor:'#55555f',wall:'#3a3a46',acc:'#ffb066',amb:['#9aa0c0',.55],sun:.25,pt:1,deco:'rock',t:[{n:'Вугілля',c:'#8c8f96',dot:'#3a3a44',hp:18,v:9},{n:'Залізо',c:'#8c8f96',dot:'#d9b08c',hp:35,v:22}],x:{n:'Торговий хист',e:'🏮',b:600,g:1.6,d:()=>'Ціна продажу: +'+S.x[1]*10+'% → +'+(S.x[1]+1)*10+'%'}},
{n:'Шахта',e:'⛏️',cost:6000,sky:'#1d130b',floor:'#6b4a2a',wall:'#4a3320',acc:'#ffc266',amb:['#d8b890',.55],sun:.25,pt:1,deco:'beam',t:[{n:'Золото',c:'#8c8f96',dot:'#ffd23f',hp:90,v:70},{n:'Смарагд',c:'#2fc27a',hp:150,v:130}],x:{n:'Динамітний удар',e:'🧨',b:5000,g:1.6,d:()=>'Шанс крита ×3: '+Math.round(Math.min(.6,S.x[2]*.08)*100)+'% → '+Math.round(Math.min(.6,(S.x[2]+1)*.08)*100)+'%'}},
{n:'Кристали',e:'💎',cost:70000,sky:'#0f0826',floor:'#3b2a6e',wall:'#2a1a55',acc:'#b27cff',amb:['#a898ff',.6],sun:.2,pt:1.3,deco:'crystal',t:[{n:'Аметист',c:'#9b5de5',hp:450,v:380},{n:'Діамант',c:'#5fe3f5',hp:900,v:850}],x:{n:'Кристальний рюкзак',e:'💠',b:40000,g:1.6,d:()=>'Місткість: +'+S.x[3]*25+' → +'+(S.x[3]+1)*25}},
{n:'Лавові глибини',e:'🌋',cost:900000,sky:'#1a0502',floor:'#2b1410',wall:'#3a1a10',acc:'#ff6a2a',amb:['#ff9a70',.55],sun:.2,pt:1.5,deco:'lava',t:[{n:'Обсидіан',c:'#3b2554',hp:2800,v:2600},{n:'Серце лави',c:'#ff5a1f',hp:7000,v:7500}],x:{n:'Лавова кирка',e:'🔥',b:300000,g:1.6,d:()=>'Сила удару: +'+S.x[4]*40+'% → +'+(S.x[4]+1)*40+'%'}}];
const UD=[
{n:'Кирка',e:'⛏️',b:25,g:1.5,d:()=>'Удар: '+fmt(dmg())+' → '+fmt(dmg(1))},
{n:'Рюкзак',e:'🎒',b:40,g:1.45,d:()=>'Місткість: '+cap()+' → '+(cap()+10)},
{n:'Авто-копач',e:'🤖',b:200,g:1.55,d:()=>'Авто-удари: '+(S.u[2]*.6).toFixed(1)+' → '+((S.u[2]+1)*.6).toFixed(1)+' за с'},
{n:'Удача',e:'🍀',b:120,g:1.6,d:()=>'Подвійна руда: '+Math.round(luck()*100)+'% → '+Math.round(Math.min(.6,(S.u[3]+1)*.06)*100)+'%'}];
const freshRm=()=>ZN.map(()=>new Uint8Array(NC*DEEP));
S={coins:0,total:0,bag:0,bv:0,u:[0,0,0,0],x:[0,0,0,0,0],zone:0,zu:[true,false,false,false,false],r:0,rm:freshRm()};
try{const r=JSON.parse(localStorage.getItem('shakhtar3d2-save')||'null');if(r&&Array.isArray(r.u)&&Array.isArray(r.zu)&&Array.isArray(r.x)){S={coins:+r.coins||0,total:+r.total||0,bag:+r.bag||0,bv:+r.bv||0,u:UD.map((_,i)=>+r.u[i]||0),x:ZN.map((_,i)=>+r.x[i]||0),zone:+r.zone||0,zu:ZN.map((_,i)=>!!r.zu[i]||i===0),r:+r.r||0,
rm:ZN.map((_,i)=>{const a=new Uint8Array(NC*DEEP),q=r.rm&&r.rm[i];if(typeof q==='string')for(let k=0;k<a.length&&k<q.length;k++)a[k]=q.charCodeAt(k)===49?1:0;return a})};if(!S.zu[S.zone])S.zone=0}}catch(e){}
const save=()=>{try{localStorage.setItem('shakhtar3d2-save',JSON.stringify(Object.assign({},S,{rm:S.rm.map(a=>{let t='';for(let k=0;k<a.length;k++)t+=a[k]?'1':'0';return t})})))}catch(e){}};
const rm=()=>1+.5*S.r,dm=()=>1+.25*S.r,sm=()=>rm()*(1+.1*S.x[1]);
const dmg=n=>(1+S.u[0]+(n||0))*dm()*(1+.4*S.x[4]),cap=()=>15+S.u[1]*10+25*S.x[3],auto=()=>S.u[2]*.6,luck=()=>Math.min(.6,S.u[3]*.06),critCh=()=>Math.min(.6,S.x[2]*.08);
const ucost=i=>Math.ceil(UD[i].b*Math.pow(UD[i].g,S.u[i])),xcost=()=>{const x=ZN[S.zone].x;return Math.ceil(x.b*Math.pow(x.g,S.x[S.zone]))};
const need=()=>250000*Math.pow(2.5,S.r);
// ---- audio ----
let AC=null,muted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,vol,slide,delay){const a=ac();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+(delay||0);o.type=type;o.frequency.setValueAtTime(f,s);if(slide)o.frequency.exponentialRampToValueAtTime(slide,s+d);g.gain.setValueAtTime(vol,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d)}
function noise(d,vol){const a=ac();if(!a||muted)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}
function sfx(k){if(k==='hit'){noise(.05,.12);tone(130+Math.random()*50,.07,'square',.1,70)}
else if(k==='break'){noise(.14,.25);tone(420,.12,'triangle',.2,760)}
else if(k==='sell'){[784,988,1175,1568].forEach((f,i)=>tone(f,.1,'triangle',.2,0,i*.06))}
else if(k==='buy'){[523,659,784].forEach((f,i)=>tone(f,.1,'triangle',.18,0,i*.06))}
else if(k==='zone'){[392,523,659,784,1047].forEach((f,i)=>tone(f,.15,'triangle',.2,0,i*.08))}
else if(k==='tp'){tone(300,.3,'sine',.2,1200)}
else if(k==='rebirth'){for(let i=0;i<8;i++)tone(220*Math.pow(1.19,i),.18,'sawtooth',.12,0,i*.07)}
else if(k==='err'){tone(220,.18,'square',.12,140)}}
$('snd').addEventListener('click',()=>{muted=!muted;$('snd').textContent=muted?'🔇':'🔊'});
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1800)}
// ---- three ----
const cv=$('c'),renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(58,1,.1,140);
const amb=new THREE.AmbientLight(0xffffff,.6),sun=new THREE.DirectionalLight(0xffffff,.7);sun.position.set(8,16,6);scene.add(amb,sun);
const lamp=new THREE.PointLight(0xffe0b0,1,26);scene.add(lamp);
const pls=[[-12,6,-12],[12,6,-12],[-12,6,12],[12,6,12]].map(p=>{const l=new THREE.PointLight(0xffffff,0,30);l.userData.o=p;scene.add(l);return l});
function rz(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rz);rz();
function tileTex(hex,rx,ry){const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d'),col=new THREE.Color(hex);
for(let i=0;i<16;i++)for(let j=0;j<16;j++){const k=.8+Math.random()*.32;x.fillStyle='rgb('+Math.min(255,col.r*255*k|0)+','+Math.min(255,col.g*255*k|0)+','+Math.min(255,col.b*255*k|0)+')';x.fillRect(i,j,1,1)}
const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return t}
function mkCracks(){const L=[],n=6+Math.floor(Math.random()*3),cl=v=>Math.max(-.5,Math.min(.5,v));
function walk(x,y,a,max){const p=[[x,y]];for(let k=0;k<max;k++){a+=(Math.random()-.5)*.7;x+=Math.cos(a)*.09;y+=Math.sin(a)*.09;p.push([cl(x),cl(y)]);if(Math.abs(x)>=.5||Math.abs(y)>=.5)return p}return p}
for(let i=0;i<n;i++){const a=i/n*6.283+(Math.random()-.5)*.6;const p=walk((Math.random()-.5)*.06,(Math.random()-.5)*.06,a,16);
const e=p[p.length-1];if(Math.abs(e[0])<.5&&Math.abs(e[1])<.5){const d=Math.max(Math.abs(Math.cos(a)),Math.abs(Math.sin(a)));p.push([cl(e[0]+Math.cos(a)/d),cl(e[1]+Math.sin(a)/d)])}
L.push({p:p,at:0});
for(let b=0;b<2;b++){const j=2+Math.floor(Math.random()*Math.max(1,p.length-4)),q=p[Math.min(j,p.length-2)];L.push({p:walk(q[0],q[1],a+(Math.random()<.5?-1:1)*(.7+Math.random()*.6),5),at:.2+Math.random()*.45})}}
return L}
function drawCracks(x,s,f,cr){if(f<=0)return;x.save();x.translate(s/2,s/2);x.beginPath();x.rect(-s/2,-s/2,s,s);x.clip();x.lineCap='round';x.lineJoin='round';
for(let pass=0;pass<2;pass++){x.strokeStyle=pass?'rgba(255,255,255,.3)':'rgba(0,0,0,.85)';x.lineWidth=pass?1.2:3.6;x.beginPath();
for(const c of cr){const ff=c.at?Math.max(0,(f-c.at)/(1-c.at)):f;if(ff<=0)continue;const segs=c.p.length-1,t=Math.min(1,ff*1.1+.06)*segs,full=Math.floor(t),part=t-full;
x.moveTo(c.p[0][0]*s,c.p[0][1]*s);for(let i=1;i<=full&&i<=segs;i++)x.lineTo(c.p[i][0]*s,c.p[i][1]*s);
if(full<segs){const a=c.p[full],b=c.p[full+1];x.lineTo((a[0]+(b[0]-a[0])*part)*s,(a[1]+(b[1]-a[1])*part)*s)}}
x.stroke()}x.restore()}
function box(w,h,d,col,x,y,z,em){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:col,emissive:em||0x000000}));m.position.set(x,y,z);return m}
function label(txt,w){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.fillStyle='rgba(15,17,25,.8)';x.beginPath();x.roundRect(2,2,252,60,14);x.fill();x.fillStyle='#fff';x.font='bold 28px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,128,34);
const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(w,w/4,1);s.renderOrder=5;return s}
// ---- player ----
const pl=new THREE.Group();scene.add(pl);
const legL=box(.28,.7,.3,0x2a3a7a,-.2,.7,0),legR=box(.28,.7,.3,0x2a3a7a,.2,.7,0);legL.geometry.translate(0,-.35,0);legR.geometry.translate(0,-.35,0);

if(cur===0&&xr){const z=ZN[S.zone],cc=xcost();xr.querySelector('em').textContent='Рів. '+S.x[S.zone];xr.querySelector('small').textContent=z.x.d();xr.querySelector('.c').textContent='🪙 '+fmt(cc);xr.disabled=S.coins<cc;
UD.forEach((u,i)=>{const r=ur[i],q=ucost(i);r.querySelector('em').textContent='Рів. '+S.u[i];r.querySelector('small').textContent=u.d();r.querySelector('.c').textContent='🪙 '+fmt(q);r.disabled=S.coins<q})}
if(cur===1){const n=need(),ok=S.total>=n;$('rinfo').innerHTML='Скинь прогрес (монети, прокачку, зони, шахти) і отримай <b>постійний множник</b>: монети ×'+(1+.5*(S.r+1))+', сила удару ×'+(1+.25*(S.r+1))+'.<br>Зароблено за забіг: <b>'+fmt(S.total)+'</b> з '+fmt(n)+'.';$('rbar').style.width=Math.min(100,S.total/n*100)+'%';$('rb').disabled=!ok}}
// ---- loop ----
let last=performance.now(),T=0,uacc=0,sv=0;
function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;T+=dt;
const zi=Math.max(0,Math.min(4,Math.floor((pz+15)/PITCH)));if(zi!==S.zone)setCur(zi);
let mx=jx+(K.d?1:0)-(K.a?1:0),mz=-jy+(K.w?1:0)-(K.s?1:0);const l=Math.hypot(mx,mz);if(l>1){mx/=l;mz/=l}
const sp=6*(1+.08*S.x[0]),fx=-Math.sin(cyaw),fz=-Math.cos(cyaw),rx=Math.cos(cyaw),rz2=-Math.sin(cyaw),vx=(fx*mz+rx*mx)*sp,vz=(fz*mz+rz2*mx)*sp;
const tryMove=(nx,nz)=>{if(!walk(nx,nz))return;if(hitBox(nx,py,nz))return;px=nx;pz=nz};tryMove(px+vx*dt,pz);tryMove(px,pz+vz*dt);
const Oz=S.zone*PITCH;
for(const s of [SHOP,STALL]){const x0=s.x-s.w/2-.45,x1=s.x+s.w/2+.45,z0=Oz+s.z-s.d/2-.45,z1=Oz+s.z+s.d/2+.45;if(px>x0&&px<x1&&pz>z0&&pz<z1){const a=px-x0,b=x1-px,c=pz-z0,d=z1-pz,m=Math.min(a,b,c,d);if(m===a)px=x0;else if(m===b)px=x1;else if(m===c)pz=z0;else pz=z1}}
pvy=Math.max(pvy-28*dt,-30);const ny=py+pvy*dt;if(floorHit(px,ny,pz)){py=-Math.floor(-ny/B)*B+.001;pvy=0}else py=ny;
// mining
let tgt=null;if(mineB&&!gone(mineB.c,mineB.k))tgt=mineB;else if(btnMine)tgt=digTarget();
if(tgt){macc+=dt;if(macc>=.17){macc=0;if(reachBlk(tgt.c,tgt.k))hitBlk(tgt.c,tgt.k,true);else if(mineB)mineB=null}}
if(auto()>0){aacc+=auto()*dt;while(aacc>=1){aacc-=1;const t=digTarget();if(t)hitBlk(t.c,t.k,false)}}
mining=Math.max(0,mining-dt);punch=Math.max(0,punch-dt*6);
if(tb&&mine){const b=bc(S.zone,tb.c,tb.k);ov.position.set(b.x,b.y,b.z);ov.scale.setScalar(1-.05*punch);hs.position.set(b.x,b.y+B*.62+.3,b.z)}
// player visuals
pl.position.set(px,py,pz);let tr=pl.rotation.y;if(tgt){const b=bc(S.zone,tgt.c,tgt.k);tr=Math.atan2(b.x-px,b.z-pz)}else if(l>.1)tr=Math.atan2(vx,vz);
let dd=tr-pl.rotation.y;dd=Math.atan2(Math.sin(dd),Math.cos(dd));pl.rotation.y+=dd*Math.min(1,dt*12);
const w=l>.1?Math.sin(T*11)*.7:0;legL.rotation.x=w;legR.rotation.x=-w;armL.rotation.x=-w*.8;arm.rotation.x=mining>0?-.4-Math.abs(Math.sin(T*16))*1.6:w*.8;
lamp.position.set(px,py+2.4,pz);
// camera
const cd=9.5,ty=py+1.6;let cx=px+Math.sin(cyaw)*Math.cos(cpitch)*cd,cy=ty+Math.sin(cpitch)*cd,cz=pz+Math.cos(cyaw)*Math.cos(cpitch)*cd;
cam.position.set(Math.max(-14.8,Math.min(14.8,cx)),cy,Math.max(Oz-14.8,Math.min(Oz+23,cz)));cam.lookAt(px,ty,pz);
for(const q of PP){if(q.life<=0)continue;q.life-=dt;q.v.y-=18*dt;q.m.position.addScaledVector(q.v,dt);if(q.life<=0)q.m.visible=false}
const rg=gates[S.zone]&&S.zone<4&&!S.zu[S.zone+1]&&Math.abs(px-CORX)<3.2&&Math.abs(pz-(Oz+19))<4.6;
$('bShop').style.display=rectNear(SHOP,3.3)?'flex':'none';$('bSell').style.display=rectNear(STALL,3.3)?'flex':'none';$('bSell').style.opacity=S.bag>0?1:.5;
$('bTele').style.display=colAt(px,pz)>=0?'block':'none';
$('bGate').style.display=rg?'block':'none';if(rg)$('bGate').textContent='🔓 Відкрити «'+ZN[S.zone+1].n+'» — 🪙 '+fmt(ZN[S.zone+1].cost);
if(cur>=0&&!rectNear(SHOP,6))openTab(-1);
uacc+=dt;sv+=dt;if(uacc>.2){uacc=0;ui()}if(sv>5){sv=0;save()}
renderer.render(scene,cam);requestAnimationFrame(loop)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});addEventListener('pagehide',save);
