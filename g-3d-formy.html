<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D форми</title>
<style>
:root{--bg:#0b0b14;--panel:rgba(18,18,30,.55);--chip:rgba(255,255,255,.12);--chip-on:rgba(255,255,255,.9);--fg:#fff;--fg-on:#12121e;--muted:rgba(255,255,255,.7);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05050b;--panel:rgba(10,10,18,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#05050b;--panel:rgba(10,10,18,.6);color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#tools{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:10px;z-index:3}
#tools button{width:46px;height:46px;border-radius:50%;border:0;background:var(--panel);color:var(--fg);font-size:22px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;padding:0}
#hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 22px);text-align:center;color:var(--muted);font-size:14px;transition:opacity .6s;pointer-events:none;z-index:3;text-shadow:0 1px 6px rgba(0,0,0,.5)}
#ui{position:fixed;left:0;right:0;bottom:0;padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px 22px 0 0;z-index:3}
.lbl{font-size:12px;color:var(--muted);padding:0 16px 4px}
.row{display:flex;gap:8px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;padding:8px 10px;border:0;border-radius:14px;background:var(--chip);color:var(--fg);font:inherit;font-size:12px;cursor:pointer}
.chip span{font-size:22px;line-height:1.1}
.chip.on{background:var(--chip-on);color:var(--fg-on);font-weight:700}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tools"><button id="bcol" aria-label="Колір">🎨</button><button id="bsty" aria-label="Стиль">◼</button><button id="bshat" aria-label="Розбити">💥</button><button id="bsnd" aria-label="Звук">🔊</button></div>
<div id="hint">Крути пальцем · щипок для масштабу</div>
<div id="ui"><div class="lbl">Форма</div><div class="row" id="shapes"></div><div class="lbl">Фон</div><div class="row" id="bgs"></div></div>
<script src="three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const PAL=['#ff5d73','#ffb84d','#5ee38f','#4db8ff','#b07cff','#ff7ad9'];
let ci=3,si=0,bi=0,style=0;
function heartGeo(){const sh=new THREE.Shape();sh.moveTo(0,.5);sh.bezierCurveTo(0,.9,-.5,1.1,-.9,.8);sh.bezierCurveTo(-1.4,.4,-1.1,-.3,0,-1);sh.bezierCurveTo(1.1,-.3,1.4,.4,.9,.8);sh.bezierCurveTo(.5,1.1,0,.9,0,.5);const g=new THREE.ExtrudeGeometry(sh,{depth:.5,bevelEnabled:true,bevelThickness:.2,bevelSize:.15,bevelSegments:4,curveSegments:24});g.center();g.scale(1.1,1.1,1.1);return g}
function starGeo(){const sh=new THREE.Shape();for(let i=0;i<10;i++){const r=i%2?.6:1.4,a=i/10*Math.PI*2+Math.PI/2;i?sh.lineTo(Math.cos(a)*r,Math.sin(a)*r):sh.moveTo(Math.cos(a)*r,Math.sin(a)*r)}sh.closePath();const g=new THREE.ExtrudeGeometry(sh,{depth:.45,bevelEnabled:true,bevelThickness:.12,bevelSize:.1,bevelSegments:3});g.center();return g}
function helixGeo(){class C extends THREE.Curve{getPoint(t,o){const a=t*Math.PI*2*4.5;return(o||new THREE.Vector3()).set(Math.cos(a)*.8,(t-.5)*2.8,Math.sin(a)*.8)}}return new THREE.TubeGeometry(new C(),220,.16,10,false)}
function crystalGeo(){const pts=[[0,-1.4],[.7,-.6],[.85,.5],[.45,1.0],[0,1.45]].map(a=>new THREE.Vector2(a[0],a[1]));return new THREE.LatheGeometry(pts,6)}
const SH=[
{n:'Куб',e:'🧊',flat:true,g:()=>new THREE.BoxGeometry(1.6,1.6,1.6)},
{n:'Сфера',e:'🔮',g:()=>new THREE.SphereGeometry(1.1,48,32)},
{n:'Піраміда',e:'🔺',flat:true,g:()=>new THREE.ConeGeometry(1.25,1.9,4)},
{n:'Тор',e:'🍩',g:()=>new THREE.TorusGeometry(.9,.38,28,72)},
{n:'Октаедр',e:'💎',flat:true,g:()=>new THREE.OctahedronGeometry(1.3)},
{n:'Додекаедр',e:'⬢',flat:true,g:()=>new THREE.DodecahedronGeometry(1.2)},
{n:'Вузол',e:'🪢',g:()=>new THREE.TorusKnotGeometry(.8,.28,160,20)},
{n:'Циліндр',e:'🥫',g:()=>new THREE.CylinderGeometry(.9,.9,1.8,48)},
{n:'Ікосаедр',e:'🔷',flat:true,g:()=>new THREE.IcosahedronGeometry(1.3,0)},
{n:'Тетраедр',e:'🔻',flat:true,g:()=>new THREE.TetrahedronGeometry(1.6)},
{n:'Серце',e:'❤️',g:heartGeo},
{n:'Зірка',e:'⭐',g:starGeo},
{n:'Пружина',e:'🌀',g:helixGeo},
{n:'Кристал',e:'🔮',flat:true,g:crystalGeo},
{n:'Кільце',e:'💍',g:()=>new THREE.TorusGeometry(1.15,.2,24,90)},
{n:'Вузол 2',e:'🧶',g:()=>new THREE.TorusKnotGeometry(.85,.2,200,16,3,5)}];
function nebula(x,w,h){[['rgba(120,60,220,.30)',.2,.25],['rgba(40,120,255,.22)',.8,.45],['rgba(255,80,170,.20)',.4,.75],['rgba(80,40,200,.25)',.75,.9]].forEach(a=>{const g=x.createRadialGradient(a[1]*w,a[2]*h,0,a[1]*w,a[2]*h,w*.7);g.addColorStop(0,a[0]);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,w,h)})}
function moon(x,w,h){x.save();x.shadowColor='rgba(220,230,255,.9)';x.shadowBlur=70;x.fillStyle='#f3f0e0';x.beginPath();x.arc(w*.72,h*.17,58,0,6.283);x.fill();x.restore();x.fillStyle='rgba(180,175,150,.35)';[[.70,.16,12],[.75,.19,9],[.69,.2,7]].forEach(c=>{x.beginPath();x.arc(w*c[0],h*c[1],c[2],0,6.283);x.fill()})}
function sun(x,w,h){x.save();x.shadowColor='rgba(255,200,120,1)';x.shadowBlur=90;x.fillStyle='rgba(255,236,170,.95)';x.beginPath();x.arc(w/2,h*.68,115,0,6.283);x.fill();x.restore()}
function grid(x,w,h){const hz=h*.62;x.strokeStyle='rgba(255,60,200,.55)';x.lineWidth=2;for(let i=0;i<10;i++){const y=hz+Math.pow(i/9,2)*(h-hz);x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke()}for(let i=-8;i<=8;i++){x.beginPath();x.moveTo(w/2,hz);x.lineTo(w/2+i*w*.22,h);x.stroke()}x.save();x.shadowColor='#ff2e9a';x.shadowBlur=60;x.fillStyle='#ffd0ee';x.beginPath();x.arc(w/2,hz-40,70,0,6.283);x.fill();x.restore()}
const BG=[
{n:'Космос',e:'🌌',st:[[0,'#05010f'],[.5,'#12062a'],[1,'#240a3d']],d:nebula,p:{n:1800,s:.07,c:0xffffff,m:'twinkle',z0:-18,z1:-4,v:0},amb:[0xb69cff,.45],pt:[0x8a6bff,1.3]},
{n:'Ніч',e:'🌙',st:[[0,'#020611'],[1,'#10285a']],d:moon,p:{n:700,s:.06,c:0xdde8ff,m:'twinkle',z0:-18,z1:-4,v:0},amb:[0x7f9bff,.4],pt:[0x6f8cff,1.1]},
{n:'Захід',e:'🌅',st:[[0,'#2b1055'],[.5,'#d9486e'],[1,'#ffb36b']],d:sun,amb:[0xffc9a0,.6],pt:[0xff8f5a,1.4]},
{n:'Океан',e:'🌊',st:[[0,'#021b36'],[1,'#0a8fae']],p:{n:160,s:.12,c:0xcff6ff,m:'rise',z0:-8,z1:3,v:.5},amb:[0x7fe0ff,.5],pt:[0x3fd0ff,1.2]},
{n:'Сніг',e:'❄️',st:[[0,'#5a7fa8'],[1,'#dbe9f6']],p:{n:450,s:.1,c:0xffffff,m:'fall',z0:-8,z1:3,v:.7},amb:[0xffffff,.7],pt:[0xbfd8ff,.9]},
{n:'Неон',e:'🌆',st:[[0,'#12002b'],[.6,'#5a0a6e'],[1,'#ff2e9a']],d:grid,p:{n:110,s:.09,c:0x00f0ff,m:'rise',z0:-8,z1:2,v:.35},amb:[0xff7ad9,.5],pt:[0x00f0ff,1.5]}];
// scene
const cv=$('c'),renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,100);cam.position.z=5.2;
const amb=new THREE.AmbientLight(0xffffff,.5),key=new THREE.DirectionalLight(0xffffff,1),pl=new THREE.PointLight(0xffffff,1.2,0);
key.position.set(3,4,5);pl.position.set(-4,-2,3);scene.add(amb,key,pl);
function rz(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',rz);rz();
// background + particles
let pts=null,pm='',bgTex=null;
function setBG(i){bi=i;const c=BG[i];
const cvs=document.createElement('canvas');cvs.width=512;cvs.height=1024;const x=cvs.getContext('2d');
const g=x.createLinearGradient(0,0,0,1024);c.st.forEach(s=>g.addColorStop(s[0],s[1]));x.fillStyle=g;x.fillRect(0,0,512,1024);if(c.d)c.d(x,512,1024);
if(bgTex)bgTex.dispose();bgTex=new THREE.CanvasTexture(cvs);scene.background=bgTex;
amb.color.set(c.amb[0]);amb.intensity=c.amb[1];pl.color.set(c.pt[0]);pl.intensity=c.pt[1];
if(pts){scene.remove(pts);pts.geometry.dispose();pts.material.dispose();pts=null}
if(c.p){const p=c.p,a=new Float32Array(p.n*3);for(let k=0;k<p.n;k++){a[k*3]=(Math.random()-.5)*26;a[k*3+1]=(Math.random()-.5)*26;a[k*3+2]=p.z0+Math.random()*(p.z1-p.z0)}
const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(a,3));
pts=new THREE.Points(geo,new THREE.PointsMaterial({size:p.s,color:p.c,transparent:true,opacity:.9,depthWrite:false}));scene.add(pts);pm=p.m}
mark()}
// shape
let mesh=null,grow=0,rx=.4,ry=.6,vx=0,vy=0;
function mat(){const c=PAL[ci]||PAL[0];
if(style===1)return new THREE.MeshStandardMaterial({color:c,wireframe:true,emissive:c,emissiveIntensity:.5});
if(style===2)return new THREE.MeshStandardMaterial({color:c,transparent:true,opacity:.55,metalness:.1,roughness:.1,side:THREE.DoubleSide});
return new THREE.MeshStandardMaterial({color:c,metalness:.35,roughness:.35,flatShading:!!SH[si].flat})}
function setShape(i){si=i;if(mesh){scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose()}
mesh=new THREE.Mesh(SH[i].g(),mat());mesh.position.y=.35;scene.add(mesh);mesh.scale.setScalar(.01);grow=0;mark()}
function remat(){if(!mesh)return;mesh.material.dispose();mesh.material=mat()}
// UI
const sr=$('shapes'),br=$('bgs'),sc=[],bc=[];
function chip(row,arr,e,n,fn){const b=document.createElement('button');b.className='chip';b.innerHTML='<span>'+e+'</span>'+n;b.addEventListener('click',fn);row.appendChild(b);arr.push(b)}
SH.forEach((s,i)=>chip(sr,sc,s.e,s.n,()=>setShape(i)));
BG.forEach((b,i)=>chip(br,bc,b.e,b.n,()=>setBG(i)));
function mark(){sc.forEach((b,i)=>b.classList.toggle('on',i===si));bc.forEach((b,i)=>b.classList.toggle('on',i===bi))}
$('bcol').addEventListener('click',()=>{ci=(ci+1)%(PAL.length+1);remat()});
$('bsty').addEventListener('click',()=>{style=(style+1)%3;$('bsty').textContent=['◼','▦','◻'][style];remat()});
// gestures
const ptr=new Map();let pd=0,zt=5.2,hinted=false,tap0=null;
function hide(){if(!hinted){hinted=true;$('hint').style.opacity=0}}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});hide();ac();tap0=ptr.size===1?{t:performance.now(),x:e.clientX,y:e.clientY}:null;if(ptr.size===2){const a=[...ptr.values()];pd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});
cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
if(ptr.size===1){vx=dx*.012;vy=dy*.012;ry+=vx;rx+=vy}
else if(ptr.size===2){const a=[...ptr.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);zt=Math.max(2.6,Math.min(10,zt-(d-pd)*.02));pd=d}});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,e=>{if(n==='pointerup'&&tap0&&performance.now()-tap0.t<350&&Math.hypot(e.clientX-tap0.x,e.clientY-tap0.y)<10)tapMesh(e.clientX,e.clientY);tap0=null;ptr.delete(e.pointerId)}));
cv.addEventListener('wheel',e=>{e.preventDefault();zt=Math.max(2.6,Math.min(10,zt+e.deltaY*.005))},{passive:false});
// ---- fx: sound, jelly, shards ----
let AC=null,snd=true,jel=0;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,vol,slide,delay){const a=ac();if(!a||!snd)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(delay||0);o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}
function noise(d,vol){const a=ac();if(!a||!snd)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain();g.gain.value=vol;s.buffer=b;s.connect(g);g.connect(a.destination);s.start()}
const SP=[];for(let i=0;i<90;i++){const m=new THREE.Mesh(new THREE.TetrahedronGeometry(.13),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.4}));m.visible=false;scene.add(m);SP.push({m:m,v:new THREE.Vector3(),r:new THREE.Vector3(),l:0})}
function shards(n,sp){if(!mesh)return;const base=ci===PAL.length?new THREE.Color().setHSL(Math.random(),.8,.6):new THREE.Color(PAL[ci]);let c=0;
for(const q of SP){if(q.l>0)continue;q.l=1+Math.random()*.7;q.m.visible=true;q.m.material.color.copy(base).offsetHSL((Math.random()-.5)*.1,0,(Math.random()-.5)*.25);
q.m.position.copy(mesh.position).add(new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5));q.v.set((Math.random()-.5)*sp,(Math.random()-.2)*sp,(Math.random()-.5)*sp);q.r.set(Math.random()*9,Math.random()*9,Math.random()*9);if(++c>=n)break}}
const rc=new THREE.Raycaster(),nd=new THREE.Vector2();
function tapMesh(cx,cy){nd.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);rc.setFromCamera(nd,cam);if(mesh&&mesh.scale.x>.5&&rc.intersectObject(mesh).length){jel=1;shards(16,4);const f=300+si*45+Math.random()*60;tone(f,.14,'sine',.3,f*1.8);tone(f*1.5,.12,'triangle',.15,f*2.2,.05)}}
function shatter(){if(!mesh||grow<0)return;ac();shards(80,8);noise(.35,.35);tone(500,.4,'sawtooth',.12,60);mesh.scale.setScalar(.01);grow=-2.2;setTimeout(()=>{tone(260,.18,'triangle',.22,520);tone(520,.2,'triangle',.18,1040,.1)},1100)}
$('bshat').addEventListener('click',shatter);$('bsnd').addEventListener('click',()=>{snd=!snd;$('bsnd').textContent=snd?'🔊':'🔇'});
// loop
let last=performance.now(),T=0;
const ease=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;T+=dt;
if(!ptr.size){vx*=.95;vy*=.95;ry+=vx+.006;rx+=vy+.002}
if(mesh){grow=Math.min(1,grow+dt*2.5);const e=Math.max(.01,ease(Math.max(0,grow)));jel=Math.max(0,jel-dt*2.2);const w=Math.sin(T*28)*.22*jel;mesh.scale.set(e*(1+w),e*(1-w),e*(1+w));mesh.rotation.set(rx,ry,0);mesh.position.y=.35+Math.sin(T*1.2)*.06;if(ci===PAL.length){const c=mesh.material.color;c.setHSL((T*.12)%1,.75,.55);if(style===1&&mesh.material.emissive)mesh.material.emissive.copy(c)}}
for(const q of SP){if(q.l<=0)continue;q.l-=dt;q.v.y-=9*dt;q.m.position.addScaledVector(q.v,dt);q.m.rotation.x+=q.r.x*dt;q.m.rotation.y+=q.r.y*dt;q.m.scale.setScalar(Math.min(1,q.l*2));if(q.l<=0)q.m.visible=false}
cam.position.z+=(zt-cam.position.z)*Math.min(1,dt*8);
if(pts){const p=BG[bi].p;
if(pm==='twinkle'){pts.rotation.z+=dt*.01;pts.material.opacity=.75+.25*Math.sin(T*2)}
else{const a=pts.geometry.attributes.position.array;for(let k=0;k<a.length;k+=3){if(pm==='rise'){a[k+1]+=dt*p.v;a[k]+=Math.sin(T+k)*dt*.1;if(a[k+1]>13)a[k+1]=-13}else{a[k+1]-=dt*p.v;a[k]+=Math.sin(T*.8+k)*dt*.25;if(a[k+1]<-13)a[k+1]=13}}pts.geometry.attributes.position.needsUpdate=true}}
renderer.render(scene,cam);requestAnimationFrame(loop)}
setBG(0);setShape(0);requestAnimationFrame(loop);
</script>

</body>
